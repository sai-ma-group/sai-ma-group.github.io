photo: "/images/sai-ma.jpg"

bio: >
  Dr. Sai Ma is an Assistant Professor in the Department of Genetics and
  Genomic Sciences at the Icahn School of Medicine at Mount Sinai. He received
  his postdoctoral training with Aviv Regev and Jason Buenrostro at the Broad
  Institute and Harvard Department of Stem Cell and Regenerative Biology.

  His research program develops single-cell and spatial multi-omic technologies
  to understand gene regulation across development, aging, and disease.

research_interests: >
  Single-cell and spatial genomics, epigenetics, chromatin regulation,
  multimodal technology development, cell-state transitions, development,
  aging, and disease.

