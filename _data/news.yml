- date: 2023-01
  title: TF atlas collaboration published in Cell
  summary: Our collaboration with Feng Zhang’s group at Broad Institute is now published in Cell. We massively screened every single TF in hESC differentiation by combining SHARE-seq with genetic perturbation and surprisingly found 27% of TF genes could function as master regulators.
  image: /images/news/2023-01-tf-atlas-collaboration-published-in-cell.png
  link: ''
  credit: Cell
