  title: Drop-BS paper accepted in Nature Communications
  summary: Our collaborative paper with Dr. Chang Lu at Virginia Tech is now accepted in Nature Communications. We demonstrate a droplet-based microfluidic technology, Drop-BS, to construct single-cell bisulfite sequencing libraries for DNA methylome profiling. Check out the paper!
