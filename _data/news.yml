- date: 2023-04
  title: mSWI/SNF perturbation work published in Molecular Cell
  summary: Our collaborative work with Cigall Kadoch’s group is now published in Molecular Cell! We leveraged CRISPR-Cas9 knockout screens to target mSWI/SNF subunits individually and in select combinations, followed by single-cell RNA-seq and multi-omic assay (perturb-SHARE-seq). These single-cell subunit perturbation signatures mapped across bulk primary human tumor expression profiles both mirror and predict cBAF loss-of-function status in cancer.
  image: /images/news/2023-04-mswi-snf-perturbation-work-published-in-molecular-cell.jpg
  link: ''
  credit: Molecular Cell
- date: 2023-03
  title: PRINT preprint on bioRxiv
  summary: Our preprint is now on bioRxiv! We present a computational tool, PRINT, to predict chromatin binding proteins (TF & histone) from large-scale scATAC data.
  image: /images/news/2024-11-footprinting-paper-accepted-in-nature.png
  link: ''
  credit: bioRxiv
- date: 2023-03
  title: Spatial epigenome–transcriptome work published in Nature
  summary: Our collaborative paper with Dr. Rong Fan at Yale University is now published in Nature. We present two technologies for spatially resolved, genome-wide, joint profiling of the epigenome and transcriptome by co-sequencing chromatin accessibility/histone modification and gene expression on the same tissue section at near-single-cell resolution.
  image: /images/news/2023-03-spatial-epigenometranscriptome-work-published-in-nature.png
  link: ''
  credit: Nature
