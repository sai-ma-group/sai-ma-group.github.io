- date: 2026-07
  title: UHRF1 preprint now available online
  summary: Our new preprint, “Uhrf1 loss disrupts Ctcf-associated chromatin organization during early mouse embryogenesis,” is now available online. This study shows how UHRF1 coordinates DNA methylation, chromatin architecture, and lineage stabilization during early embryonic development leveraging ME-seq.
  image: /images/news/2026-07-uhrf1-preprint-now-available-online.png
  link: ''
  credit: ''
- date: 2026-06
