heading: "Join the Sai Ma Lab"

intro: >
  We are always interested in hearing from motivated scientists who want
  to develop or apply single-cell and spatial genomics technologies.

postdocs: >
  We are recruiting postdoctoral fellows with interests in single-cell genomics,
  epigenetics, computational biology, technology development, hematopoiesis,
  aging, and disease.

students: >
  Graduate students interested in rotating with the lab are encouraged to
  contact us.

other_trainees: >
  We welcome inquiries from research assistants, interns, visiting students,
  and other trainees when opportunities are available.

contact: >
  Please email Dr. Ma at sai.ma2@mssm.edu with your CV and a 
  brief description of your research interests.
