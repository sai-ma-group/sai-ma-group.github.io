media:
  input: images
  output: /images

content:
  - name: home
    label: Home
    type: file
    path: _data/home.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: hero_title
        label: Main headline
        type: string
      - name: hero_text
        label: Intro text
        type: text
      - name: hero_image
        label: Image width (pixels)
        type: image

  - name: team
    label: Team
    type: file
    path: _data/team.yml
    format: yaml
    list: true
    operations:
      delete: false
    fields:
      - name: name
        label: Name
        type: string
      - name: role
        label: Position
        type: string
      - name: photo
        label: Photo
        type: image
      - name: bio
        label: Short bio
        type: text

  - name: news
    label: News
    type: file
    path: _data/news.yml
    format: yaml
    list: true
    operations:
      delete: false
    fields:
      - name: date
        label: Date
        type: string
      - name: title
        label: Headline
        type: string
      - name: summary
        label: Summary
        type: text
      - name: image
        label: Image
        type: image
        
  - name: publications
    label: Publications
    type: file
    path: _data/publications.yml
    format: yaml
    list: true
    operations:
      delete: true
    fields:
      - name: year
        label: Year
        type: number

      - name: title
        label: Title
        type: string

      - name: authors
        label: Authors
        type: text

      - name: journal
        label: Journal
        type: string

      - name: url
        label: Publication link
        type: string

      - name: featured
        label: Featured publication
        type: boolean
  - name: join
    label: Join Us
    type: file
    path: _data/join.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: heading
        label: Heading
        type: string

      - name: intro
        label: Introduction
        type: text

      - name: postdocs
        label: Postdoctoral Fellows
        type: text

      - name: students
        label: Graduate Students
        type: text

      - name: other_trainees
        label: Other Trainees
        type: text

      - name: contact
        label: Contact
        type: text
        
  - name: resources
    label: Resources
    type: file
    path: _data/resources.yml
    format: yaml
    list: true
    operations:
      delete: true
    fields:
      - name: category
        label: Category
        type: string

      - name: title
        label: Resource name
        type: string

      - name: description
        label: Description
        type: text

      - name: url
        label: Link
        type: string

      - name: type
        label: Type
        type: string
