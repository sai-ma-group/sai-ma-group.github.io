<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | Sai Ma Lab</title>

  <link rel="stylesheet" href="/css/style.css?v=6">
</head>

<body>

<header class="site-header">
  <div
    class="container"
    style="
      min-height: 76px;
      display: grid;
      grid-template-columns: 1fr auto 80px;
      align-items: center;
      gap: 32px;
    "
  >

    <!-- LEFT -->
    <a href="/" class="logo">
      Sai Ma Lab
    </a>


    <!-- CENTER -->
    <nav style="display: flex; gap: 30px; align-items: center;">
      <a href="https://github.com/sai-ma-group" target="_blank">
        Research
      </a>
      <a href="/team.html">Team</a>
      <a href="/publications.html">Publications</a>
      <a href="/sai-ma.html">Sai Ma</a>
      <a href="/join.html">Join Us</a>
    </nav>


    <!-- RIGHT -->
    {% if site.data.home.lab_logo %}
      <a
        href="/"
        style="
          display: flex;
          justify-content: flex-end;
          align-items: center;
        "
      >
        <img
          src="{{ site.data.home.lab_logo }}"
          alt="Sai Ma Lab logo"
          style="
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
          "
        >
      </a>
    {% endif %}

  </div>
</header>

<main>
  {{ content }}
</main>

<footer>
  <div class="container footer-inner">
    <div>
      <strong>Sai Ma Lab</strong><br>
      Icahn School of Medicine at Mount Sinai
    </div>

    <div>
      © 2026 Sai Ma Lab
    </div>
  </div>
</footer>

</body>
</html>
